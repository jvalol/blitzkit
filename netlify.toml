# The product site at blitzkit.jva.lol, per spec 0038 on jva.lol.
#
# This file overrides whatever the Netlify dashboard holds, so the deploy is
# reproducible from a clone and the UI cannot drift away from the repo. Same
# reason jva.lol's netlify.toml says so at the top of itself.
#
# ship-check runs first. Any site copy still marked "[COPY - Jake]" is prose
# that was proposed and is not yet Jake's, and it fails the build before
# anything reaches the web.
#
# The screenshots are copied in rather than duplicated. They live in media/ at
# the repo root because both readmes link them there by absolute URL, and the
# crate excludes that directory from what it publishes. Netlify builds from
# site/, which cannot see a sibling directory, so the build brings them along.
[build]
  # publish and command are resolved RELATIVE TO base, not to the repo root.
  # Confirmed by a failed deploy on 2026-09-26 that resolved publish to
  # /opt/build/repo/site/site/public and said so in its "Resolved config".
  base = "site"
  publish = "public"
  command = "./scripts/build"

  # **Build every time, and do not be clever about it.**
  #
  # Netlify's default for a project with a `base` is to skip the build when
  # nothing under that base changed. That is wrong here and was wrong from the
  # day `base` was set: the clips, the stills and the browser builds live at
  # the repo root on purpose, because both readmes link them by absolute URL
  # and there is one copy of each, and `scripts/build` copies them in. Netlify
  # never gets as far as running that, so it cannot see them.
  #
  # It went unnoticed because every push until 2026-10-17 happened to carry a
  # change under site/ along with them. Two that did not were cancelled with
  # "No changes detected in base directory", and the site quietly served the
  # old clips and an arcade without the room at the end of the aisle. Nothing
  # in the repo could have told us: ./check-fresh compares the repo against
  # itself and was perfectly happy.
  #
  # The precise fix is an ignore command naming the paths that matter. It is
  # not used, because a subtly wrong one fails the same silent way as the
  # default did and it took a screenshot of the deploy log to find this one.
  # `false` exits non-zero, which is Netlify's way of saying build it. The
  # site is a Hugo run of about a tenth of a second and a file copy, so what
  # this costs is nothing and what it buys is never having to wonder.
  ignore = "false"

[build.environment]
  # Keep aligned with the Hugo that jva.lol pins and that is installed locally.
  HUGO_VERSION = "0.166.0"

# /docs/promises/ and /docs/how-its-built/ were the same page under two names
# on 2026-09-26, and it is gone.
#
# It described the engine's behaviour as written down in specs, which is true,
# and the spec-first sequence, which is true only since 2026-09-20. The engine
# was started on 2020-11-01 and ran for 23 commits before any spec existed, so
# the older specs describe what was already built rather than having designed
# it. Corrected, the page shrank to one sentence and an anecdote about values
# transcribed wrong, which is a thin thing to give a page and the wrong face
# for a project six years older than its specs.
[[redirects]]
  from = "/docs/promises/"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs/how-its-built/"
  to = "/"
  status = 301
