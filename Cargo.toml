[package]
name = "blitzkit"
version = "0.7.0"
authors = ["Jake Van Alstyne ☥ <j@jva.lol>"]
edition = "2018"
rust-version = "1.87"
description = "A small 2D and 3D game engine over wgpu: meshes, textures, lighting, shadows, collision, text and sound"
repository = "https://github.com/jvalol/blitzkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gamedev", "graphics", "wgpu", "3d", "engine"]
categories = ["game-engines", "graphics"]
# the old name's final release lives here; it is not part of this crate.
# media is the readme's screenshots, which it links to by absolute url so they
# render on crates.io too, so shipping half a megabyte of them would be waste.
# site is the product site at blitzkit.jva.lol, a Hugo project with a vendored
# theme: 225 files and most of ten megabytes that nobody depending on this
# crate has any use for.
exclude = ["farewell", "media", "site", "shapes"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["shapes"]

[dependencies]
winit = "0.30"
glam = { version = "0.33", features = ["bytemuck"] }
tobj = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
env_logger = "0.11"
log = "0.4"
wgpu = "30"
wgpu_text = "30"
pollster = "1"
bytemuck = "1.4"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[dev-dependencies]
# The named shapes two examples draw. A dev-dependency, so it is not in the
# published dependency graph, which is what makes the cycle legal: it depends
# on this crate in turn.
blitzkit-shapes = { path = "shapes" }
glam = "0.33"
